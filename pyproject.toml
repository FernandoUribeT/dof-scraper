[project]
name = "dof-scraper"
version = "0.1.0"
description = "Scraper for the Diario Oficial de la Federación (Mexico) that fails closed on bad data instead of returning it"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
]

[project.scripts]
dof-scraper = "dof_scraper.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dof_scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
